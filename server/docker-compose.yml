# Reqora sync server for production: PostgreSQL + the server + Caddy (automatic HTTPS).
# See DEPLOY.md. In short: copy .env.example to .env, fill it in, then
#   docker compose up -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reqora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reqora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqora -d reqora"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    restart: unless-stopped
    environment:
      REQORA_DATABASE_URL: postgresql+asyncpg://reqora:${POSTGRES_PASSWORD}@db:5432/reqora
      # Signing up needs an invite code (admin create-invite) unless this is true.
      REQORA_OPEN_REGISTRATION: ${REQORA_OPEN_REGISTRATION:-false}
      # Only Caddy can reach this container (no published port), so trust its X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      REQORA_DOMAIN: ${REQORA_DOMAIN:?set REQORA_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

volumes:
  pgdata:
  caddy_data:
  caddy_config:
