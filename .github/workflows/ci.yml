name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: build for both architectures to ship a universal app.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Package (.deb)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          ./packaging/build-deb.sh

      - name: Package (.zip + installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/build-windows.ps1
          if (-not (Test-Path dist\Reqora-Setup-*.exe)) { throw 'The installer was not built' }

      - name: Package (.dmg, universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/reqora \
            target/aarch64-apple-darwin/release/reqora \
            target/x86_64-apple-darwin/release/reqora
          BIN=target/universal/reqora ./packaging/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: reqora-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.zip
            dist/*.exe
            dist/*.dmg

  server:
    name: Sync server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reqora
          POSTGRES_PASSWORD: reqora
          POSTGRES_DB: reqora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reqora -d reqora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test (SQLite)
        run: pytest

      - name: Test (PostgreSQL)
        env:
          REQORA_TEST_DATABASE_URL: postgresql+asyncpg://reqora:reqora@localhost:5432/reqora_test
        run: pytest

      - name: Docker image
        run: docker build -t reqora-server .

  # Pushing a tag like v0.3.0 publishes a GitHub release with every package, and updates the
  # Homebrew tap when the HOMEBREW_TAP_TOKEN secret is set (see "Releasing" in README.md).
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --title "Reqora $VERSION" --generate-notes

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP || format('{0}/homebrew-reqora', github.repository_owner) }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap was not updated."
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          packaging/homebrew/render-cask.sh "$VERSION" "dist/reqora_${VERSION}_macos_universal.dmg" > tap/Casks/reqora.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/reqora.rb
          if git diff --cached --quiet; then
            echo "The tap already has reqora $VERSION"
          else
            git commit -m "reqora $VERSION"
            git push
          fi
